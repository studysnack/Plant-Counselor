[project]
name = "plant-counselor-backend"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    # Database — Supabase access over PostgREST HTTP (no SQLAlchemy/psycopg2)
    "supabase>=2.30.0",
    # Auth — Supabase JWT verification (ES256 via JWKS, HS256 fallback)
    "python-jose[cryptography]>=3.3.0",
    # Config & env
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # LLM (Google Gemini 2.5 Flash)
    "google-genai>=1.0.0",
    # Scheduling (wilting/rot auto-transition)
    "apscheduler>=3.10.0",
    # Utilities
    "python-ulid>=2.0.0",
    "cryptography>=42.0.0",
]

[tool.poetry]
# This repository runs app.main directly and is not published as a Python package.
package-mode = false

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
